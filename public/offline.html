<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C7F84B" />
    <title>You’re offline · Booknplay.lk</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #fbfcf8;
        --navy: #092636;
        --lime: #c7f84b;
        --muted: #5b6b75;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background:
          radial-gradient(circle at 80% 10%, rgba(199, 248, 75, 0.35), transparent 28%),
          linear-gradient(160deg, #fbfcf8 0%, #eef4ea 100%);
        color: var(--navy);
      }
      main {
        width: min(28rem, 100%);
        text-align: center;
        padding: 2rem 1.5rem;
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(9, 38, 54, 0.08);
        box-shadow: 0 18px 48px rgba(9, 38, 54, 0.08);
      }
      img {
        width: 72px;
        height: 72px;
        margin: 0 auto 1rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 850;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a, button {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        padding: 0.65rem 1.15rem;
        border-radius: 0.75rem;
        font-size: 0.9rem;
        font-weight: 800;
        text-decoration: none;
        border: none;
        cursor: pointer;
      }
      button {
        background: var(--lime);
        color: var(--navy);
      }
      a {
        background: transparent;
        color: var(--navy);
        border: 1px solid rgba(9, 38, 54, 0.18);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pwa-192x192.png" alt="Booknplay" width="72" height="72" />
      <h1>You’re offline</h1>
      <p>
        Booknplay needs a connection to load venues, bookings, and payments.
        Check your network, then try again.
      </p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Retry</button>
        <a href="/">Go home</a>
      </div>
    </main>
  </body>
</html>
